
add_document:
  name: Add document
  description: Add a document to the selected registry.
  fields:
    directory:
      name: Registry
      description: Select the target registry.
      required: true
      selector:
        config_entry:
          integration: docharbor
    name:
      name: Document name
      required: true
      selector:
        text:
    uin:
      name: UIN or certificate number
      selector:
        text:
    issue_date:
      name: Issue date
      selector:
        text:
    expiry_date:
      name: Expiry date
      description: Enter as YYYY-MM-DD.
      required: true
      selector:
        text:
    category:
      name: Category
      selector:
        text:
    renewal_lead_days:
      name: Renewal lead time (days)
      selector:
        number:
          min: 0
          max: 730
          mode: box
    notes:
      name: Notes
      selector:
        text:

