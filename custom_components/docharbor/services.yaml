set_schedule_dates:
  name: Set schedule dates
  description: Set the scheduled start and end dates for a directory.
  fields:
    directory:
      name: Directory
      description: Select the target directory.
      required: true
      selector:
        config_entry:
          integration: docharbor
    start_date:
      name: Scheduled start date
      description: Enter as YYYY-MM-DD.
      selector:
        text:
    end_date:
      name: Scheduled end date
      description: Enter as YYYY-MM-DD.
      selector:
        text:
    buffer_days:
      name: Planning buffer (days)
      selector:
        number:
          min: 0
          max: 180
          mode: box

